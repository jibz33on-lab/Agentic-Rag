# Local services for the projects in this repo.
#   docker compose up -d     start
#   docker compose down      stop, keeping data
#   docker compose down -v   stop and wipe data

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: agentic-rag-qdrant
    ports:
      - "6333:6333"   # HTTP API and dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: agentic-rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Browse the Postgres tables at http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agentic-rag-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # No master password prompt. It only encrypts passwords pgAdmin
      # itself remembers, which is pointless for a local container.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  # Project 01's HTTP API. See projects/01-basic-rag/designs/containerisation.md
  #
  #   docker compose up -d --build api     build and start
  #   docker compose logs -f api           watch it
  #   docker compose down                  stop everything
  #
  # It answers from whatever is already in Qdrant. It does not ingest: the
  # corpus lives on the host and `main.py ingest` is still a host command.
  api:
    build:
      # The repo root, because pyproject.toml and uv.lock live there and nothing
      # inside the project folder can reach up to them. The Dockerfile sits
      # beside the code it builds; the two are set separately on purpose.
      context: .
      dockerfile: projects/01-basic-rag/Dockerfile
    container_name: agentic-rag-api
    ports:
      # host:container. The left 8000 is the port on your Mac; the right one is
      # the port uvicorn listens on inside. Change the left one if 8000 is taken.
      - "8000:8000"
    # The whole .env, unchanged and still correct for host-side commands.
    # Deliberately the whole file rather than a hand-written list: almost every
    # setting in config.py has a default, and EMBEDDING_MODEL, CHUNK_SIZE and
    # CHUNK_OVERLAP build collection_name — so a list that falls one variable
    # behind would not crash, it would answer 200 from a different, empty
    # collection.
    env_file: .env
    environment:
      # The one variable whose correct value differs inside a container.
      # localhost:6333 is right on your Mac and wrong in here, because a
      # container's localhost is itself. `qdrant` is the service name below, and
      # Docker resolves it on the network Compose puts these services on.
      # `environment:` wins over `env_file:`, which is what makes this an
      # override rather than a conflict.
      QDRANT_URL: http://qdrant:6333
    # No `restart:`, unlike the services above. They are infrastructure that
    # should stay up; this is the thing under change. A crashed container that
    # stays crashed holds a readable traceback, where a restart loop scrolls it
    # away. The AWS step will want the opposite.
    #
    # No `depends_on:` either. Nothing connects to Qdrant at import — retrieval
    # opens the vector_store per request — so the API starts fine without it,
    # and plain depends_on waits for a container to start rather than to be
    # ready, which would not have helped anyway.

volumes:
  qdrant-data:
  postgres-data:
  pgadmin-data:
