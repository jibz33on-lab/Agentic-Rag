name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        # Exit code 5 means "no tests collected", which is expected until the
        # first mini project lands. Drop this tolerance once one exists.
        run: |
          uv run pytest; code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 5 ]
