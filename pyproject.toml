[project]
name = "agentic-rag"
version = "0.1.0"
description = "A growing series of mini projects exploring agentic RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-qdrant>=1.1.0",
    # Both arrive transitively via langchain, and both are now imported
    # directly — langsmith for reading traces back, openai for the evaluation
    # generator and judge. A langchain bump must not be able to move them.
    "langsmith>=0.12.1",
    "openai>=3.7.0",
    "psycopg[binary]>=3.3.5",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# Reranking. Deliberately an extra rather than a dependency or a dependency
# group: CI runs `uv sync --all-groups`, which installs groups but not extras,
# so torch stays out of every push for a component most runs never touch.
# reranker.py imports sentence-transformers inside a function so the module,
# and every test that fakes a reranker, works without this installed.
rerank = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# Shared runtime dependencies are added here as projects need them, so every
# project runs against one resolved environment (a single .venv, one uv.lock).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["projects"]  # add "shared" once that directory exists
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
